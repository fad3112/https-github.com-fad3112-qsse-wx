<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSSE-Wx · AGEROUTE Sénégal — Nouveau mot de passe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2L28 7v10c0 7-6 11-12 13C10 28 4 24 4 17V7z' fill='%231B3A8C'/><text x='16' y='21' text-anchor='middle' fill='%23F5A623' font-size='8' font-weight='700' font-family='Inter,sans-serif' letter-spacing='1'>QSSE</text></svg>">
  <style>
    body { font-family: var(--font-sans); font-size: 13px; margin: 0; }
  </style>
</head>
<body>
<div class="login-body">
  <div class="login-card">

    <div class="login-logo">
      <svg class="login-logo-mark" viewBox="0 0 48 56" width="72" height="84" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2A52C9"/>
            <stop offset="100%" stop-color="#1B3A8C"/>
          </linearGradient>
          <linearGradient id="sf-shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,.28)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <path d="M24 3L43 10V30C43 44 24 52 24 52C24 52 5 44 5 30V10Z" fill="#000" opacity=".18" transform="translate(1.5,2.5)"/>
        <path d="M24 3L43 10V30C43 44 24 52 24 52C24 52 5 44 5 30V10Z" fill="url(#sf)"/>
        <path d="M24 3L43 10V22C36 19 24 17 24 17C24 17 12 19 5 22V10Z" fill="url(#sf-shine)"/>
        <path d="M24 3L43 10V30C43 44 24 52 24 52C24 52 5 44 5 30V10Z" fill="none" stroke="#F5A623" stroke-width="2"/>
        <path d="M24 6L40 12V30C40 42 24 49 24 49C24 49 8 42 8 30V12Z" fill="none" stroke="#F5A623" stroke-width=".6" opacity=".35"/>
        <text x="24" y="29" text-anchor="middle" dominant-baseline="central" fill="#F5A623" font-size="9" font-weight="800" font-family="Inter,sans-serif" letter-spacing="2.5">QSSE</text>
      </svg>
      <div class="login-logo-text">
        <div class="login-logo-name">QSSE-Wx</div>
        <div class="login-logo-sub">AGEROUTE Sénégal</div>
      </div>
    </div>

    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:15px;font-weight:700;color:var(--color-text-primary)">Nouveau mot de passe</div>
      <div style="font-size:12px;color:var(--color-text-tertiary);margin-top:4px">Choisissez un mot de passe d'au moins 8 caractères.</div>
    </div>

    <div class="login-err" id="ERR"></div>
    <div id="OK" style="display:none;background:var(--color-success-bg,#e6f4ea);color:var(--color-success-text,#1e7b34);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;margin-bottom:14px"></div>

    <div id="FORM-WRAP">
      <div class="fg">
        <label class="fl">Nouveau mot de passe</label>
        <input class="fc" type="password" id="R-PWD" placeholder="••••••••" autocomplete="new-password" style="height:40px;font-size:13px">
      </div>
      <div class="fg">
        <label class="fl">Confirmer le mot de passe</label>
        <input class="fc" type="password" id="R-PWD2" placeholder="••••••••" autocomplete="new-password" style="height:40px;font-size:13px" onkeydown="if(event.key==='Enter')doReset()">
      </div>

      <button class="btn btn-p" id="RESET-BTN"
              style="width:100%;justify-content:center;padding:10px 0;font-size:13px;border-radius:var(--border-radius-md)"
              onclick="doReset()">
        <i class="ti ti-lock" id="BTN-IC"></i>
        <span id="BTN-TXT">Réinitialiser le mot de passe</span>
      </button>
    </div>

    <div style="margin-top:18px;text-align:center;font-size:11px">
      <a href="/login" style="color:var(--color-text-tertiary);text-decoration:none">← Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
const TOKEN = {{ token|tojson }};

if (!TOKEN) {
  document.getElementById('ERR').textContent = 'Lien invalide.';
  document.getElementById('ERR').style.display = 'block';
  document.getElementById('FORM-WRAP').style.display = 'none';
}

async function doReset() {
  const btn = document.getElementById('RESET-BTN');
  const txt = document.getElementById('BTN-TXT');
  const ic = document.getElementById('BTN-IC');
  const err = document.getElementById('ERR');
  const ok = document.getElementById('OK');
  const pwd = document.getElementById('R-PWD').value;
  const pwd2 = document.getElementById('R-PWD2').value;
  err.style.display = 'none';
  ok.style.display = 'none';
  if (pwd.length < 8) {
    err.textContent = 'Le mot de passe doit faire au moins 8 caractères';
    err.style.display = 'block';
    return;
  }
  if (pwd !== pwd2) {
    err.textContent = 'Les mots de passe ne correspondent pas';
    err.style.display = 'block';
    return;
  }
  btn.disabled = true;
  txt.textContent = 'Réinitialisation…';
  ic.className = 'ti ti-loader-2';
  ic.style.animation = 'spin .7s linear infinite';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: TOKEN, new_password: pwd, confirm_password: pwd2}),
    });
    const data = await res.json();
    if (data.ok) {
      ok.textContent = 'Mot de passe mis à jour. Redirection vers la connexion…';
      ok.style.display = 'block';
      document.getElementById('FORM-WRAP').style.display = 'none';
      setTimeout(() => window.location = '/login', 1800);
      return;
    }
    err.textContent = data.error || 'Une erreur est survenue';
    err.style.display = 'block';
  } catch (e) {
    err.textContent = 'Erreur réseau — réessayez';
    err.style.display = 'block';
  }
  btn.disabled = false;
  txt.textContent = 'Réinitialiser le mot de passe';
  ic.className = 'ti ti-lock';
  ic.style.animation = '';
}
</script>
</body>
</html>
